<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魔塔 Magic Tower</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-area" aria-label="游戏地图">
      <header class="top-bar">
        <div class="game-title">
          <h1>魔塔</h1>
          <p><span id="floorName">第 1 层</span><span class="version-mark">v3.0</span></p>
        </div>
        <button id="helpBtn" class="icon-button" type="button" aria-label="帮助">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.2 9a3 3 0 1 1 4.5 2.6c-1.1.7-1.7 1.4-1.7 2.4"/>
            <path d="M12 18h.01"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
        </button>
      </header>

      <div id="mapGrid" class="map-grid" role="grid" aria-label="8x8 魔塔地图"></div>

      <div class="mobile-controls" aria-label="移动控制">
        <button class="move-button" type="button" data-move="up" aria-label="向上">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 5 12h4v7h6v-7h4Z"/></svg>
        </button>
        <button class="move-button" type="button" data-move="left" aria-label="向左">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 12 5v4h7v6h-7v4Z"/></svg>
        </button>
        <button class="move-button" type="button" data-move="down" aria-label="向下">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 5 12h4V5h6v7h4Z"/></svg>
        </button>
        <button class="move-button" type="button" data-move="right" aria-label="向右">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 12-7 7v-4H5V9h7V5Z"/></svg>
        </button>
      </div>
    </section>

    <aside class="side-panel" aria-label="角色状态">
      <section class="panel-section hero-card">
        <span class="hero-portrait portrait-sprite" aria-hidden="true"></span>
        <div>
          <h2>勇者</h2>
          <p id="heroLevel">LV 1</p>
        </div>
      </section>

      <section class="panel-section stats-grid" aria-label="基础属性">
        <div><span>HP</span><strong id="statHp">0</strong></div>
        <div><span>ATK</span><strong id="statAtk">0</strong></div>
        <div><span>DEF</span><strong id="statDef">0</strong></div>
        <div><span>金币</span><strong id="statGold">0</strong></div>
        <div><span>经验</span><strong id="statExp">0</strong></div>
        <div><span>楼层</span><strong id="statFloor">1</strong></div>
      </section>

      <section class="panel-section key-grid" aria-label="钥匙">
        <div><span class="key-swatch yellow"></span>黄钥匙 <strong id="keyYellow">0</strong></div>
        <div><span class="key-swatch blue"></span>蓝钥匙 <strong id="keyBlue">0</strong></div>
        <div><span class="key-swatch red"></span>红钥匙 <strong id="keyRed">0</strong></div>
      </section>

      <section class="panel-section enemy-preview" aria-label="目标信息">
        <h2>前方目标</h2>
        <div id="targetInfo" class="target-info">移动到怪物、道具、门或楼梯旁查看。</div>
      </section>

      <section class="panel-section save-panel" aria-label="存档">
        <h2>存档槽</h2>
        <div id="saveSlots" class="save-slots"></div>
      </section>
    </aside>

    <section class="bottom-panel" aria-label="战斗日志和操作">
      <div class="log-header">
        <h2>日志</h2>
        <div class="action-row">
          <button id="newGameBtn" class="text-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 3v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M6 21v-5h5"/></svg>
            <span>新游戏</span>
          </button>
          <button id="manualSaveBtn" class="text-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5Z"/><path d="M8 4v6h8V4"/><path d="M8 17h8"/></svg>
            <span>保存</span>
          </button>
          <button id="quickLoadBtn" class="text-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M12 5v10"/><path d="m7 10 5 5 5-5"/></svg>
            <span>读取</span>
          </button>
          <button id="shopBtn" class="text-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l-1 10H6Z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M9 14h6"/></svg>
            <span>商店</span>
          </button>
        </div>
      </div>
      <div id="battleLog" class="battle-log" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="shopDialog" class="modal">
    <form method="dialog">
      <header class="modal-header">
        <h2>商店</h2>
        <button class="icon-button" type="submit" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="shopItems" class="shop-items"></div>
      <p id="shopHint" class="muted"></p>
    </form>
  </dialog>

  <dialog id="helpDialog" class="modal">
    <form method="dialog">
      <header class="modal-header">
        <h2>操作</h2>
        <button class="icon-button" type="submit" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="help-list">
        <p>方向键或 WASD 移动；手机端使用地图下方方向按钮。</p>
        <p>点击相邻格也可以移动，点击其他格会查看目标信息。</p>
        <p>击败每层守卫后，踩下楼梯进入下一层。</p>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/game.js"></script>
</body>
</html>
